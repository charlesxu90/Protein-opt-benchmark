name: AiCE
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy=1.23.5
  - scipy=1.12.0
  - pandas=2.2.3
  - matplotlib=3.10.0
  - networkx=3.2.1
  - biopython=1.79
  - joblib>=1.1.0
  # PyTorch with CUDA 12
  - pytorch=2.2.1
  - pytorch-cuda=12.1
  # DSSP for secondary structure
  - dssp
  - pip:
    - prody==2.4.1
    - ml-collections==0.1.1
    - dm-tree==0.1.8
